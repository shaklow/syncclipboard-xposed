# Gradle JVM 配置：增大堆内存，启用 G1GC 并降低停顿
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -Dfile.encoding=UTF-8
# 并行构建（多模块并行执行无依赖的 task）
org.gradle.parallel=true
# 按需配置：默认使用所有可用 CPU 核心
org.gradle.workers.max=16
# 启用配置缓存（跳过重复的配置阶段）
org.gradle.configuration-cache=true
# 启用构建缓存（跨构建复用 task 输出）
org.gradle.caching=true
# 默认启用 daemon（避免每次重启 JVM）
org.gradle.daemon=true

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
