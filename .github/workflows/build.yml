name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        required: true
        type: choice
        default: both
        options:
          - both
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # push 触发时无 input，默认 both
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'both' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Restore signing keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Install Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            echo "android-37 already installed"
          else
            echo "y" | $SDKMANAGER --channel=3 "platforms;android-37" || \
            echo "y" | $SDKMANAGER "platforms;android-37" || \
            echo "::warning::android-37 not installable via sdkmanager, relying on pre-installed"
          fi
          echo "y" | $SDKMANAGER "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build APKs
        run: |
          TASKS=""
          case "$BUILD_TYPE" in
            debug)   TASKS="shell:assembleDebug" ;;
            release) TASKS="shell:assembleRelease" ;;
            both)    TASKS="shell:assembleDebug shell:assembleRelease" ;;
          esac
          echo "构建类型: $BUILD_TYPE → gradle 任务: $TASKS"
          ./gradlew $TASKS --no-daemon

      - name: Rename APKs
        run: |
          for type in debug release; do
            dir="shell/build/outputs/apk/$type"
            [ -d "$dir" ] || continue
            cd "$dir"
            for f in shell-*.apk; do
              [ -f "$f" ] && mv "$f" "${f/shell-/syncclipboard-xposed-}"
            done
            cd - >/dev/null
            echo "=== $type ==="; ls -lh "$dir"/*.apk 2>/dev/null || true
          done

      - name: Upload debug APKs
        if: env.BUILD_TYPE == 'both' || env.BUILD_TYPE == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: syncclipboard-xposed-apks-debug
          path: shell/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APKs
        if: env.BUILD_TYPE == 'both' || env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: syncclipboard-xposed-apks-release
          path: shell/build/outputs/apk/release/*.apk
          if-no-files-found: error
