name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Restore signing keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Install Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            echo "android-37 already installed"
          else
            echo "y" | $SDKMANAGER --channel=3 "platforms;android-37" || \
            echo "y" | $SDKMANAGER "platforms;android-37" || \
            echo "::warning::android-37 not installable via sdkmanager, relying on pre-installed"
          fi
          echo "y" | $SDKMANAGER "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build release APKs
        run: ./gradlew shell:assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          cd shell/build/outputs/apk/release
          for f in shell-*.apk; do
            mv "$f" "${f/shell-/syncclipboard-xposed-}"
          done
          ls -lh *.apk

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: syncclipboard-xposed-apks
          path: shell/build/outputs/apk/release/*.apk
          if-no-files-found: error
