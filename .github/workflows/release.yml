name: Build & Release to LSPosed Repo

on:
  workflow_dispatch:
    inputs:
      force:
        description: "若目标 tag 已存在则覆盖发布"
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    # 缺少 token 时直接跳过，避免构建完才发现无法发布
    if: ${{ secrets.XPOSED_REPO_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Restore signing keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Install Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            echo "android-37 already installed"
          else
            echo "y" | $SDKMANAGER --channel=3 "platforms;android-37" || \
            echo "y" | $SDKMANAGER "platforms;android-37" || \
            echo "::warning::android-37 not installable via sdkmanager, relying on pre-installed"
          fi
          echo "y" | $SDKMANAGER "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build release APKs
        run: ./gradlew shell:assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          cd shell/build/outputs/apk/release
          for f in shell-*.apk; do
            mv "$f" "${f/shell-/syncclipboard-xposed-}"
          done
          ls -lh *.apk

      # ── 从 build.gradle.kts 提取版本号 ──────────────────────────
      - name: Read version
        id: ver
        run: |
          VERSION_CODE=$(grep 'appVersionCode' build.gradle.kts | head -1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')
          VERSION_NAME=$(grep 'appVersionName' build.gradle.kts | head -1 | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION_CODE-$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "读取到版本: code=$VERSION_CODE name=$VERSION_NAME tag=$VERSION_CODE-$VERSION_NAME"

      # ── 发布到 LSPosed 官方仓库 ────────────────────────────────
      - name: Create Release & Upload APKs
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
          TARGET_REPO: Xposed-Modules-Repo/io.github.erenche.syncclipboard
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
        run: |
          set -e
          APK_DIR="shell/build/outputs/apk/release"

          # 生成 release notes
          cat > /tmp/notes.md <<EOF
          ## v${VERSION_NAME}

          发布自源码仓库 [shaklow/syncclipboard-xposed](https://github.com/shaklow/syncclipboard-xposed) 的 GitHub Actions 自动构建。

          ### APK 说明
          - \`arm64-v8a\` — 64 位 ARM（主流 64 位设备）
          - \`armeabi-v7a\` — 32 位 ARM（旧设备）
          - \`x86_64\` — 模拟器 / x86 设备
          - \`universal\` — 包含全部架构（体积最大，兼容性最好）
          EOF

          # 若开启 force 且 tag 已存在，先删除旧 release
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "强制模式：尝试删除已存在的 release/tag..."
            gh release delete "$TAG" --repo "$TARGET_REPO" --yes --cleanup-tag 2>/dev/null || true
          fi

          # 创建 release 并上传全部 APK
          echo "创建 release: tag=$TAG repo=$TARGET_REPO"
          gh release create "$TAG" "$APK_DIR"/*.apk \
            --repo "$TARGET_REPO" \
            --title "SyncClipboard Xposed v${VERSION_NAME}" \
            --notes-file /tmp/notes.md

          echo "发布完成："
          gh release view "$TAG" --repo "$TARGET_REPO" --json url,assets -q '.url, (.assets[].name)'

      - name: Summary
        if: always()
        run: |
          echo "## 发布结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ 版本 \`${{ steps.ver.outputs.tag }}\` 已发布到 LSPosed 官方仓库" >> "$GITHUB_STEP_SUMMARY"
            echo "🔗 https://github.com/Xposed-Modules-Repo/io.github.erenche.syncclipboard/releases/tag/${{ steps.ver.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ 发布失败，请检查日志" >> "$GITHUB_STEP_SUMMARY"
          fi
